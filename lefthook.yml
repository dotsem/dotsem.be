pre-commit:
  parallel: true
  jobs:
    - name: gitleaks
      tags:
        - security
      run: gitleaks protect --verbose --staged

    - name: portfolio
      tags:
        - frontend
        - portfolio
      root: "portfolio/"
      group:
        parallel: false
        piped: true
        jobs:
          - name: format
            glob: "**/*.{svelte,js,ts,css}"
            run: pnpm exec prettier --write {staged_files}
            stage_fixed: true
          - name: lint
            glob: "**/*.{svelte,js,ts}"
            run: pnpm exec eslint {staged_files}
          - name: check
            glob: "**/*.{svelte,js,ts}"
            run: pnpm check
