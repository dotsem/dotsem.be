pre-commit:
  parallel: true
  commands:
    sveltecheck:
      root: "portfolio/"
      glob: '**/*.{svelte,js,ts}'
      run: pnpm check

    eslint:
      root: "portfolio/"
      glob: '**/*.{svelte,js,ts}'
      run: pnpm exec eslint {staged_files}

    prettier:
      root: "portfolio/"
      glob: '**/*.{svelte,js,ts,css}'
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
