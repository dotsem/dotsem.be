version: 2
updates:
  # GitHub Actions & composite actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    target-branch: "main"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(actions)"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/portfolio"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "UTC"
    target-branch: "main"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "@sveltejs/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "svelte*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "prettier-plugin-svelte"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-svelte"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@lucide/svelte"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      svelte:
        patterns:
          - "@sveltejs/*"
          - "svelte*"
          - "prettier-plugin-svelte"
          - "eslint-plugin-svelte"
          - "@lucide/svelte"
      tooling:
        patterns:
          - "*eslint*"
          - "prettier*"
          - "typescript*"
          - "@playwright/*"
          - "vite*"
          - "*tailwind*"
